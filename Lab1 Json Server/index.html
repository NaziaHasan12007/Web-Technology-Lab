
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>

        <!-- GET: Retrieve Students -->
        <section class="card">

            <h2>1. Retrieve Students (GET)</h2>

            <div class="buttons">
                <button onclick="getAsync()">Async/Await</button>
                <button onclick="getPromise()">Promise</button>
                <button onclick="getCallback()">Callback</button>
            </div>

            <div id="result"></div>

        </section>


        <!-- POST: Add Student -->
        <section class="card">

            <h2>2. Add Student (POST)</h2>

            <form id="studentForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Student Name"
                    required
                >

                <input
                    type="text"
                    id="department"
                    placeholder="Department"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                >

                <input
                    type="number"
                    id="semester"
                    placeholder="Semester"
                >

                <input
                    type="number"
                    id="cgpa"
                    placeholder="CGPA"
                    min="0"
                    max="4"
                    step="0.01"
                >

            </form>

            <div class="buttons">
                <button onclick="addAsync()">Async/Await</button>
                <button onclick="addPromise()">Promise</button>
                <button onclick="addCallback()">Callback</button>
            </div>

        </section>


        <!-- DELETE: Delete Student -->
        <section class="card">

            <h2>3. Delete Student (DELETE)</h2>

            <input
                type="text"
                id="deleteId"
                placeholder="Enter Student ID"
            >

            <div class="buttons">
                <button onclick="deleteAsync()">Async/Await</button>
                <button onclick="deletePromise()">Promise</button>
                <button onclick="deleteCallback()">Callback</button>
            </div>

        </section>


        <p id="message">Ready.</p>

    </div>

    <script src="script.js"></script>

</body>
</html>
